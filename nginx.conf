server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset filenames mean these can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or a redeploy leaves users on stale JS
    # that references asset hashes which no longer exist.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # DroneLab has no client-side router, but this keeps deep links working if
    # one is ever added.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # The 3D canvas needs no framing, and there is no reason to allow it.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
